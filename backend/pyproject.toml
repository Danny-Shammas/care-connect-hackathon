[project]
name = "careconnect-backend"
version = "0.1.0"
description = "AI guardian backend that places scheduled phone calls to elderly users."
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20",
    "google-cloud-firestore>=2.19,<3",
    "google-cloud-storage>=2.19,<3",
    "google-cloud-speech>=2.28,<3",
    "google-cloud-texttospeech>=2.21,<3",
    "google-cloud-language>=2.15,<3",
    "google-cloud-aiplatform>=1.74,<2",
    "google-genai>=0.3,<1",
    "firebase-admin>=6.6,<7",
    "twilio>=9.4,<10",
    "websockets>=13.1,<14",
    "httpx>=0.28,<0.29",
    "tenacity>=9.0,<10",
    "jinja2>=3.1,<4",
    "python-json-logger>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-mock>=3.14",
    "freezegun>=1.5",
    "ruff>=0.8",
    "black>=24.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]
